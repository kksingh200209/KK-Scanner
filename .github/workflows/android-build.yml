
name: Build KK Scanner Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Check Capacitor
        run: npx cap --version

      - name: Generate Android Project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android Project
        run: npx cap sync android

      - name: Configure Android camera permission and back handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          if not any(x.tag == "uses-permission" and x.get(android+"name") == "android.permission.CAMERA" for x in root):
              node = ET.Element("uses-permission")
              node.set(android+"name", "android.permission.CAMERA")
              root.insert(0, node)
          if not any(x.tag == "uses-feature" and x.get(android+"name") == "android.hardware.camera" for x in root):
              node = ET.Element("uses-feature")
              node.set(android+"name", "android.hardware.camera")
              node.set(android+"required", "false")
              root.insert(1, node)
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          activity = Path("android/app/src/main/java/com/kk/scanner/MainActivity.java")
          source = activity.read_text()
          if "KK Android permissions and back navigation" not in source:
              source = source.replace(
                  "import com.getcapacitor.BridgeActivity;",
                  """import com.getcapacitor.BridgeActivity;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;"""
              )
              source = source.replace(
                  "public class MainActivity extends BridgeActivity {",
                  """public class MainActivity extends BridgeActivity {
              // KK Android permissions and back navigation
              private static final int KK_CAMERA_PERMISSION = 7314;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M &&
                      ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.CAMERA}, KK_CAMERA_PERMISSION);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (bridge == null || bridge.getWebView() == null) {
                      super.onBackPressed();
                      return;
                  }
                  bridge.getWebView().evaluateJavascript(
                      "window.__kkAndroidBack ? window.__kkAndroidBack() : false",
                      value -> {
                          if (!"true".equals(value)) {
                              MainActivity.super.onBackPressed();
                          }
                      }
                  );
              }"""
              )
              activity.write_text(source)
          PY

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KK-Scanner-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
